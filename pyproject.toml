[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-vision-skill"
version = "0.1.0"
description = "Give text-only LLMs (DeepSeek, Xiaomi MiMo, GLM-4.5, etc.) eyes via 6 free vision engines with auto fallback, caching and document parsing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["deepseek", "vision", "multimodal", "ocr", "skill", "agent", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/yan-stone-computer/ModelVisionSkill"

[project.scripts]
model-vision-skill = "vision:entry"

[tool.setuptools]
py-modules = ["vision", "analyze_image"]
packages = ["engines"]

[tool.setuptools.package-dir]
"" = "scripts"
engines = "scripts/engines"
