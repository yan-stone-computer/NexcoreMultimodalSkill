[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexcore-multimodal-skill"
version = "0.4.0"
description = "Give text-only LLMs vision input plus consent-gated local ComfyUI/Qwen deployment and Agnes media generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["deepseek", "vision", "multimodal", "ocr", "comfyui", "qwen-image", "image-generation", "video-generation", "skill", "agent", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/yan-stone-computer/NexcoreMultimodalSkill"

[project.scripts]
nexcore-multimodal = "vision:entry"
nexcore-comfyui = "comfyui_local:main"
nexcore-comfyui-setup = "comfyui_setup:main"
nexcore-media = "agnes_api:main"

[tool.setuptools]
py-modules = ["vision", "analyze_image", "comfyui_local", "comfyui_setup", "agnes_api"]
packages = ["engines"]

[tool.setuptools.package-dir]
"" = "scripts"
engines = "scripts/engines"
